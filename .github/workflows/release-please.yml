name: Release

on:
  push:
    branches: [main]

# Least privilege by default; each job opts into exactly what it needs.
permissions: {}

jobs:
  # Maintains the "release PR" (version bump + CHANGELOG). Merging that PR
  # creates the git tag + GitHub Release and flips `release_created` to true.
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes to npm only when the release PR was just merged. Runs in the same
  # workflow run (the default token can't trigger a separate release-event
  # workflow), gated behind a protected environment for a human approval step.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up toolchain
        uses: ./.github/actions/setup

      # Publish with the npm CLI (provenance + OIDC trusted publishing are
      # not available in pnpm). No NPM_TOKEN: npm exchanges the workflow's
      # OIDC identity for a short-lived credential and attaches provenance.
      # The `prepack` hook builds the package before publishing.
      - run: npm publish --provenance --access public
