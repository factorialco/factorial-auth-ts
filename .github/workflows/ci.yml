name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm checks:tsc

      - name: Lint
        run: pnpm checks:lint

      - name: Format check
        run: pnpm checks:format

      - name: Knip unused code check
        run: pnpm checks:knip

      - name: Package checks (build + publint + attw)
        run: pnpm checks:package

      - name: Test
        run: pnpm test:coverage

      - name: Report coverage on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@3c054a2d2e2ca45446417ad5d6d5eb33092af8f1 # v2.12.1

  # Enforce Conventional Commits so release-please can derive versions and the
  # changelog. Lints both the PR title (squash-merge lands it as the commit)
  # and every commit in the PR (merge/rebase lands them individually).
  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose

      - name: Lint commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --verbose --from "$BASE_SHA" --to "$HEAD_SHA"
